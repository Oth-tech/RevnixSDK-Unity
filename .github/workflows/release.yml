# Release the Revnix Unity SDK.
#
# Dispatched by revnix-app's "Release SDKs" workflow on every merge to its
# main, and runnable by hand. One run = one version: it moves `## Unreleased`
# in CHANGELOG.md into a dated entry, bumps package.json, RevnixClient.SdkVersion
# and the README install URLs, lands that through a pull request (the org
# ruleset gives main merge commits only and no direct pushes, so there is no
# other way in), then tags the merge commit and cuts a GitHub release.
#
# For Unity Package Manager that tag IS the release: there is no registry to
# push to, the Package Manager resolves this repository by git tag.

name: Release
run-name: "Release ${{ inputs.run_key || format('manual-{0}', github.run_id) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump. auto reads the Unreleased section of CHANGELOG.md."
        type: choice
        options: [auto, major, minor, patch]
        default: auto
      version:
        description: "Exact next version (x.y.z, above the current one). Empty = bump."
        type: string
        default: ""
      app_sha:
        description: "revnix-app commit this release rides on (recorded in the changelog)."
        type: string
        default: ""
      run_key:
        description: "Caller's correlation key; becomes the run name so the caller can find this run."
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test main before touching it
        run: dotnet test .github/ci/Revnix.Sdk.Tests.csproj

      - name: Is main already ahead of the tags?
        id: pending
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if ! git ls-remote --exit-code --tags origin "refs/tags/v*" >/dev/null 2>&1; then
            echo "No release tags yet; the first release bumps from $CURRENT."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$CURRENT" >/dev/null 2>&1; then
            echo "v$CURRENT is tagged; a normal release follows."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$CURRENT is on main but not tagged — releasing it instead of bumping."
            scripts~/release.sh --notes-for "$CURRENT" --notes-out "$RUNNER_TEMP/release-notes.md"
            {
              echo "pending=true"
              echo "version=$CURRENT"
              echo "sha=$(git rev-parse HEAD)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Has the code moved since the last release?
        if: steps.pending.outputs.pending != 'true'
        id: changed
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            if git diff --quiet "v$CURRENT" HEAD -- . ':(exclude).github' ':(exclude)*.md' ':(exclude)scripts~'; then
              CHANGED=false
            else
              CHANGED=true
            fi
            echo "Since v$CURRENT: changed=$CHANGED"
          else
            CHANGED=true
            echo "No tag v$CURRENT to compare against; treating the tree as changed."
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          RELEASE=true
          [ "$BUMP" = auto ] && [ "$CHANGED" = false ] && RELEASE=false
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Decide and apply the next version
        if: steps.changed.outputs.release == 'true'
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          scripts~/release.sh \
            --bump "$BUMP" \
            --version "$VERSION" \
            --app-sha "$APP_SHA" \
            --changed "${{ steps.changed.outputs.changed }}" \
            --notes-out "$RUNNER_TEMP/release-notes.md"

      - name: Refuse to reuse a version that already exists
        if: steps.changed.outputs.release == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$NEXT" >/dev/null 2>&1; then
            echo "::error::Tag v$NEXT already exists. Bump package.json past it and re-run."
            exit 1
          fi

      - name: package.json, the source constant and the README agree
        if: steps.changed.outputs.release == 'true'
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRC=$(sed -n 's/.*public const string SdkVersion = "\([^"]*\)".*/\1/p' Runtime/Core/RevnixClient.cs)
          if [ "$PKG" != "$NEXT" ] || [ "$SRC" != "$NEXT" ]; then
            echo "::error::expected $NEXT everywhere, got package.json=$PKG source=$SRC."
            exit 1
          fi
          if ! grep -qF "RevnixSDK-Unity.git#v$NEXT" README.md || grep -qF "RevnixSDK-Unity.git#v$CURRENT" README.md; then
            echo "::error::README.md install URLs do not point at #v$NEXT."
            exit 1
          fi

      - name: Test the bumped tree
        if: steps.changed.outputs.release == 'true'
        run: dotnet test .github/ci/Revnix.Sdk.Tests.csproj

      - name: Land the bump through a pull request (main takes merge commits only)
        if: steps.changed.outputs.release == 'true'
        id: land
        env:
          NEXT: ${{ steps.version.outputs.next }}
          SUMMARY: ${{ steps.version.outputs.summary }}
        run: |
          BRANCH="release/v$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Release $NEXT" -m "$SUMMARY"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "Release $NEXT" --body-file "$RUNNER_TEMP/release-notes.md")
          echo "Opened $PR_URL"
          # GitHub computes mergeability asynchronously after the PR opens.
          MERGED=""
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$PR_URL" --merge --delete-branch; then MERGED=1; break; fi
            sleep 10
          done
          if [ -z "$MERGED" ]; then
            echo "::error::Could not merge $PR_URL — nothing was released."
            exit 1
          fi
          git fetch origin main
          git checkout -q origin/main
          LANDED=$(node -p "require('./package.json').version")
          if [ "$LANDED" != "$NEXT" ]; then
            echo "::error::main carries $LANDED after the merge, expected $NEXT."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve what to release
        if: steps.pending.outputs.pending == 'true' || steps.changed.outputs.release == 'true'
        id: pub
        env:
          PENDING: ${{ steps.pending.outputs.pending }}
        run: |
          if [ "$PENDING" = "true" ]; then
            echo "next=${{ steps.pending.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ steps.pending.outputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "next=${{ steps.version.outputs.next }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ steps.land.outputs.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and release
        if: steps.pending.outputs.pending == 'true' || steps.changed.outputs.release == 'true'
        env:
          NEXT: ${{ steps.pub.outputs.next }}
          SHA: ${{ steps.pub.outputs.sha }}
        run: |
          # git refuses an annotated tag without a committer identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEXT" -m "com.revnix.sdk $NEXT" "$SHA"
          git push origin "v$NEXT"
          gh release create "v$NEXT" --target "$SHA" --title "Revnix Unity SDK $NEXT" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Summary
        if: always()
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.pub.outputs.next }}
          LEVEL: ${{ steps.version.outputs.level }}
          LOCKSTEP: ${{ steps.version.outputs.lockstep }}
          PR: ${{ steps.land.outputs.pr }}
          PENDING: ${{ steps.pending.outputs.pending }}
          APP_SHA: ${{ inputs.app_sha }}
          RELEASE: ${{ steps.changed.outputs.release }}
        run: |
          if [ "$RELEASE" = "false" ]; then
            {
              echo "## Revnix (Unity): no release"
              echo ""
              echo "no changes since the last tag, skipped"
              echo "- status: ${{ job.status }}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Revnix (Unity) ${NEXT:-?}"
            echo ""
            if [ "$PENDING" = "true" ]; then
              echo "- released the version already on main (a previous run merged it but did not tag)"
            else
              echo "- from ${CURRENT:-?} (${LEVEL:-?} bump, lockstep=${LOCKSTEP:-?})"
            fi
            [ -n "$PR" ] && echo "- release PR: $PR"
            [ -n "$APP_SHA" ] && echo "- revnix-app: $APP_SHA"
            echo "- UPM: https://github.com/Oth-tech/RevnixSDK-Unity.git#v${NEXT:-?}"
            echo "- status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
